<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="eyebrow">Forge</div>
      <h1>设置</h1>
      <p>调整娱乐额度与网站黑名单</p>
    </header>

    <div class="settings-card">
      <div class="section">
        <div class="section-header"><h2>娱乐阈值</h2><div class="section-line"></div></div>
        <p class="desc">每天免费娱乐时长，超过后锁定所有黑名单网站</p>
        <div class="goal-row">
          <input type="number" id="threshold" min="15" max="180" step="15">
          <span class="unit">分钟</span>
        </div>
      </div>

      <div class="section">
        <div class="section-header"><h2>全天解锁工作时长</h2><div class="section-line"></div></div>
        <p class="desc">累计工作达到此时长后，当天不再锁定</p>
        <div class="goal-row">
          <input type="number" id="full-unlock" min="60" max="480" step="30">
          <span class="unit">分钟</span>
        </div>
      </div>

      <div class="section">
        <div class="section-header"><h2>娱乐网站黑名单</h2><div class="section-line"></div></div>
        <p class="desc">每行一个域名，例如 bilibili.com</p>
        <textarea id="blocked-sites" rows="10"></textarea>
      </div>

      <div class="actions">
        <button id="save" class="btn">保存设置</button>
        <span id="msg" class="msg"></span>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
