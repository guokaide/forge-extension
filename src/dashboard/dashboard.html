<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="eyebrow">Forge</div>
      <h1>统计</h1>
      <p>专注力与浏览记录</p>
    </header>

    <div id="streak-summary"></div>

    <div class="section">
      <div class="section-header"><h2>今日概览</h2><div class="section-line"></div></div>
      <div id="today-stats" class="today-stats"></div>
    </div>

    <div class="section">
      <div class="section-header"><h2>最近 7 天</h2><div class="section-line"></div></div>
      <div id="chart" class="chart"></div>
    </div>

    <div class="section">
      <div class="section-header"><h2>今日网站用时</h2><div class="section-line"></div></div>
      <div id="site-time" class="site-time"></div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
