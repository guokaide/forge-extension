<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <h1>⚒ Forge 数据面板</h1>

    <div class="cards">
      <div class="card streak-card">
        <div class="card-value" id="streak">0</div>
        <div class="card-label">天连续达标</div>
      </div>
      <div class="card today-card">
        <div class="card-value" id="ratio">-</div>
        <div class="card-label">今日工作/娱乐比</div>
      </div>
    </div>

    <div class="section">
      <h2>今日概览</h2>
      <div id="today-stats" class="today-stats"></div>
    </div>

    <div class="section">
      <h2>最近 7 天</h2>
      <div id="chart" class="chart"></div>
    </div>

    <div class="section">
      <h2>今日网站用时</h2>
      <div id="site-time" class="site-time"></div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
